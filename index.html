<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dot Matrix Print Show</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background-color:#0d0e12;color:#33ff33;font-family:'Courier New',Courier,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px;overflow-x:hidden;}
h1{font-size:1.4rem;letter-spacing:2px;text-shadow:0 0 8px rgba(51,255,51,0.6);margin-bottom:10px;text-transform:uppercase;}
#overlay{position:fixed;inset:0;background:rgba(10,10,14,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;cursor:pointer;text-align:center;border:2px solid #33ff33;margin:20px;}
#overlay h2{font-size:2rem;margin-bottom:15px;color:#33ff33;text-shadow:0 0 10px #33ff33;}
#overlay p{color:#88ff88;font-size:1rem;max-width:500px;line-height:1.5;padding:0 20px;}
#printer-rig{width:100%;max-width:900px;background:#1a1a24;border:3px solid #333;border-radius:8px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,0.8);display:flex;flex-direction:column;align-items:center;}
#status-bar{width:100%;display:flex;justify-content:space-between;font-size:0.9rem;color:#888;border-bottom:1px solid #333;padding-bottom:8px;margin-bottom:15px;}
.active-status{color:#33ff33;text-shadow:0 0 5px #33ff33;}
#paper-tray{background:#fdfaf2;width:100%;max-width:800px;border-radius:4px;box-shadow:inset 0 0 15px rgba(0,0,0,0.1),0 5px 15px rgba(0,0,0,0.5);padding:20px 0;display:flex;flex-direction:column;align-items:center;overflow:hidden;background-image:linear-gradient(#e8e4d9 1px,transparent 1px),linear-gradient(90deg,#e8e4d9 1px,transparent 1px);background-size:20px 20px;}
.print-block{display:flex;flex-direction:row;width:92%;max-width:740px;background:#fff;margin-bottom:25px;border-top:2px dashed #ccc;border-bottom:2px dashed #ccc;padding:15px;box-shadow:0 2px 5px rgba(0,0,0,0.05);position:relative;}
.print-block::before,.print-block::after{content:'';position:absolute;top:0;bottom:0;width:15px;background-image:repeating-linear-gradient(to bottom,#ddd 0px,#ddd 4px,transparent 4px,transparent 12px);}
.print-block::before{left:-18px;}
.print-block::after{right:-18px;}
.canvas-container{flex:1;display:flex;justify-content:center;align-items:center;background:#fafafa;border:1px solid #eee;padding:5px;}
canvas{max-width:100%;height:auto;image-rendering:pixelated;display:block;}
.quote-panel{flex:1;padding:15px 20px;display:flex;flex-direction:column;justify-content:center;font-family:'Courier New',Courier,monospace;color:#111;font-weight:bold;font-size:1.05rem;line-height:1.5;border-left:2px dotted #aaa;margin-left:15px;background:#fbfbf8;}
.quote-panel .quote-text{border-left:3px solid #333;padding-left:10px;font-style:italic;opacity:0;transition:opacity 0.5s ease-in;}
.quote-panel .quote-text.visible{opacity:1;}
</style>
</head>
<body>
<div id="overlay">
  <h2>[ READY TO PRINT ]</h2>
  <p>Click anywhere to start matrix printing with background audio</p>
</div>
<h1>Dot Matrix Continuous Stream</h1>
<div id="printer-rig">
  <div id="status-bar">
    <span id="status-text">STATUS: IDLE</span>
    <span id="head-pos">HEAD: 0%</span>
  </div>
  <div id="paper-tray"></div>
</div>
<script>
const items=[
  {img:'rajini.jpg',quote:'“Even if the whole world turns against you, in every situation...'},
  {img:'bleach.jpg',quote:'...the words ‘you lost’ will echo loudly in your face.'},
  {img:'goku.jpg',quote:'Until you yourself accept it, no one can ever defeat you—anyone, anywhere, forever.'},
  {img:'opm.jpg',quote:'Never, ever give up!”'}
];
let audioCtx=null;
let bgm=null;
let isStarted=false;
const overlay=document.getElementById('overlay');
const paperTray=document.getElementById('paper-tray');
const statusText=document.getElementById('status-text');
const headPos=document.getElementById('head-pos');
overlay.addEventListener('click',()=>{
  if(isStarted)return;
  isStarted=true;
  overlay.style.display='none';
  startProgram();
});
function initAudio(){
  try{
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==='suspended'){
      audioCtx.resume();
    }
    bgm=new Audio('bgm.mp3');
    bgm.loop=false;
    bgm.play().catch(e=>console.warn('Audio auto-play failed or bgm.mp3 missing:',e));
  }catch(e){
    console.warn('Audio Context initialization error:',e);
  }
}
function playPinNoise(){
  if(!audioCtx)return;
  try{
    const bufferSize=audioCtx.sampleRate*0.015;
    const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
    const data=buffer.getChannelData(0);
    for(let i=0;i<bufferSize;i++){
      data[i]=(Math.random()*2-1)*Math.exp(-i/(bufferSize*0.3));
    }
    const noise=audioCtx.createBufferSource();
    noise.buffer=buffer;
    const filter=audioCtx.createBiquadFilter();
    filter.type='bandpass';
    filter.frequency.value=2500+Math.random()*1000;
    filter.Q.value=3;
    noise.connect(filter);
    filter.connect(audioCtx.destination);
    noise.start();
  }catch(e){}
}
async function startProgram(){
  initAudio();
  statusText.textContent='STATUS: PRINTING';
  statusText.classList.add('active-status');
  for(let idx=0;idx<items.length;idx++){
    await printSingleItem(items[idx],idx+1);
  }
  statusText.textContent='STATUS: COMPLETED';
  statusText.classList.remove('active-status');
  headPos.textContent='HEAD: IDLE';
  if(bgm && !bgm.paused){
    const fadeOut=setInterval(()=>{
      if(bgm.volume>0.05){
        bgm.volume-=0.05;
      }else{
        bgm.pause();
        clearInterval(fadeOut);
      }
    },100);
  }
}
function printSingleItem(item,index){
  return new Promise((resolve)=>{
    const block=document.createElement('div');
    block.className='print-block';
    const canvasBox=document.createElement('div');
    canvasBox.className='canvas-container';
    const canvas=document.createElement('canvas');
    canvasBox.appendChild(canvas);
    const quoteBox=document.createElement('div');
    quoteBox.className='quote-panel';
    quoteBox.innerHTML=`<div class="quote-text" id="quote-${index}">${item.quote}</div>`;
    block.appendChild(canvasBox);
    block.appendChild(quoteBox);
    paperTray.appendChild(block);
    block.scrollIntoView({behavior:'smooth',block:'end'});
    const img=new Image();
    img.src=item.img;
    img.onload=()=>{
      const targetWidth=360;
      const scale=targetWidth/img.width;
      const targetHeight=Math.floor(img.height*scale);
      canvas.width=targetWidth;
      canvas.height=targetHeight;
      const ctx=canvas.getContext('2d');
      const offCanvas=document.createElement('canvas');
      offCanvas.width=targetWidth;
      offCanvas.height=targetHeight;
      const offCtx=offCanvas.getContext('2d');
      offCtx.drawImage(img,0,0,targetWidth,targetHeight);
      const imgData=offCtx.getImageData(0,0,targetWidth,targetHeight);
      const data=imgData.data;
      const dotMatrixData=[];
      for(let y=0;y<targetHeight;y++){
        const row=[];
        for(let x=0;x<targetWidth;x++){
          const idx=(y*targetWidth+x)*4;
          const avg=(data[idx]+data[idx+1]+data[idx+2])/3;
          row.push({r:data[idx],g:data[idx+1],b:data[idx+2],bw:avg});
        }
        dotMatrixData.push(row);
      }
      ctx.fillStyle='#fafafa';
      ctx.fillRect(0,0,targetWidth,targetHeight);
      let currentY=0;
      const bandHeight=6;
      const dotSpacing=2;
      function stepPrint(){
        if(currentY>=targetHeight){
          const qEl=document.getElementById(`quote-${index}`);
          if(qEl)qEl.classList.add('visible');
          setTimeout(resolve,400);
          return;
        }
        const passes=Math.min(bandHeight,targetHeight-currentY);
        for(let py=0;py<passes;py++){
          const y=currentY+py;
          const leftToRight=(y%2===0);
          for(let x=0;x<targetWidth;x+=dotSpacing){
            const px=leftToRight?x:(targetWidth-1-x);
            const p=dotMatrixData[y][px];
            if(p.bw<220){
              ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
              ctx.fillRect(px,y,1.5,1.5);
            }
          }
        }
        if(Math.random()>0.4)playPinNoise();
        headPos.textContent=`HEAD: ${Math.floor((currentY/targetHeight)*100)}% [IMG ${index}]`;
        currentY+=bandHeight;
        setTimeout(stepPrint,18+Math.random()*12);
      }
      stepPrint();
    };
    img.onerror=()=>{
      canvas.width=300;
      canvas.height=100;
      const ctx=canvas.getContext('2d');
      ctx.fillStyle='#ff3333';
      ctx.fillText(`Failed to load ${item.img}`,10,50);
      const qEl=document.getElementById(`quote-${index}`);
      if(qEl)qEl.classList.add('visible');
      setTimeout(resolve,1000);
    };
  });
}
</script>
</body>
</html>
